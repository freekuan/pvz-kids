<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" as="image" href="/assets/backgrounds/title_bg.jpg" fetchpriority="high" />
    <title>PvZ Kids - Tower Defense</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, #6ec6f5 0%, #6ec6f5 12%, #5a9e3e 12%, #488530 100%);
        overflow: hidden;
        touch-action: none;
      }
      #game-container {
        width: 100vw;
        height: 100dvh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        position: relative;
      }
      #initial-loader {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom, #87ceeb 0%, #6ec6f5 65%, #5a9e3e 65%, #488530 100%);
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        color: #1b5e20;
        z-index: 10;
      }
      #initial-loader h1 {
        font-size: 32px;
        margin-bottom: 12px;
        text-shadow: 0 2px 0 #fff;
      }
      #initial-loader p {
        font-size: 18px;
        font-weight: bold;
        color: #2e6b3a;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="initial-loader">
        <h1>🌻 Plants vs Zombies Kids</h1>
        <p>正在加载游戏资源…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
